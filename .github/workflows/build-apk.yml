name: Sestavit APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Instalace Capacitoru
        run: |
          npm i @capacitor/core @capacitor/android
          npm i -D @capacitor/cli @capacitor/assets
      - name: Vytvoření Android projektu
        run: |
          npx cap add android
          node patch-android.js
          npx capacitor-assets generate --android
          npx cap sync android
      - name: Sestavení APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk prehravac.apk
      - name: Zveřejnění ke stažení
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Přehrávač (nejnovější verze)
          files: prehravac.apk

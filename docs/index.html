<p>Lokální hudební přehrávač pro Android. Funguje bez internetu a hraje i při vypnuté obrazovce.</p>

<li>Stáhněte soubor a otevřete ho.</li>

</ol></main>
<script>
// Odkaz se odvodí z adresy stránky (uzivatel.github.io/repozitar)
const u = location.hostname.split('.')[0], r = location.pathname.split('/')[1];
